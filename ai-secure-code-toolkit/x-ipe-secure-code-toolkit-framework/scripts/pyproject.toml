[project]
name = "ai-secure-code-toolkit"
version = "0.1.0"
description = "AI secure-code toolkit: project initialization, signed Maintainer authorization and status"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "pyyaml>=6"]

[project.scripts]
secure-code = "x_ipe_secure_code.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "x_ipe_secure_code"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# FEATURE-003-B write audit (tests/support/write_audit.py): the only writes allowed outside the roots a
# test registers for each invocation.
write_audit_exceptions = [
    "{rootdir}/.pytest_cache/**",
    "**/__pycache__/**",
    "{uv_cache}/**",
    "{rootdir}/.coverage*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# pytest fixture imported by name from the 002-A integration module
"tests/guard/test_guard_tool.py" = ["F811"]
"tests/guard/test_guard_budget.py" = ["F811"]
"tests/guard/test_guard_cancel.py" = ["F811"]
"tests/guard/test_guard_egress.py" = ["F811"]

[tool.coverage.run]
source = ["x_ipe_secure_code"]
patch = ["subprocess"]
parallel = true

[tool.uv]
# uvx/uv tool rebuild the toolkit when its code changes, not only when pyproject changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
